<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content">
<meta name="screen-orientation" content="portrait">
<meta name="x5-orientation" content="portrait">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<title>德国黑慕斯蛋糕-匠心影响世界</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif}

  #gate{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    transition:opacity .3s ease;
    z-index:10;
  }
  #gate.hide{opacity:0;pointer-events:none}
  #gate > *:not(.geo):not(.title-bg){position:relative;z-index:2}

  .geo{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .geo i{position:absolute;display:block;box-sizing:border-box}

  .g1{
    width:340px;height:340px;border-radius:50%;
    border:1px solid #efefef;top:-120px;left:-110px;
    animation:drift 18s ease-in-out infinite;
  }
  .g2{
    width:250px;height:250px;border-radius:50%;
    background:#f7f7f7;right:-95px;bottom:-85px;
    animation:drift 22s ease-in-out infinite reverse;
  }
  .g3{
    width:170px;height:170px;border:1px solid #ececec;border-radius:6px;
    right:-52px;top:20%;--r:18deg;
    animation:drift 20s ease-in-out infinite;
  }
  .g4{
    width:84px;height:84px;background:#f4f4f4;border-radius:4px;
    left:-26px;bottom:22%;--r:32deg;
    animation:drift 16s ease-in-out infinite reverse;
  }
  .g5{
    width:1px;height:48%;
    background:linear-gradient(#fff,#ececec,#fff);
    left:20%;top:6%;
    animation:drift 24s ease-in-out infinite;
  }
  .g6{
    width:10px;height:10px;border-radius:50%;background:#ededed;
    right:24%;top:16%;
    animation:drift 12s ease-in-out infinite reverse;
  }
  .g7{
    width:120px;height:120px;border-radius:50%;
    border:1px dashed #f0f0f0;left:14%;bottom:8%;
    animation:drift 26s ease-in-out infinite;
  }

  @keyframes drift{
    0%,100%{transform:translate(0,0) rotate(var(--r,0deg))}
    50%{transform:translate(0,-18px) rotate(var(--r,0deg))}
  }

  .title-bg{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:560px;
    height:420px;
    background-image:url("https://ts2.tc.mm.bing.net/th/id/OIP-C.eC9Vgj18FkPTCmetlX-G-QHaHa?r=0&dpr=3.5&pid=ImgDetMain&o=7&rm=3");
    background-size:contain;
    background-position:center center;
    background-repeat:no-repeat;
    opacity:.42;
    filter:grayscale(.15) contrast(.95);
    -webkit-mask-image:radial-gradient(ellipse 68% 62% at 50% 50%, #000 28%, rgba(0,0,0,.55) 58%, transparent 80%);
    mask-image:radial-gradient(ellipse 68% 62% at 50% 50%, #000 28%, rgba(0,0,0,.55) 58%, transparent 80%);
    pointer-events:none;
    z-index:1;
  }

  #gate h1{
    font-size:26px;
    font-weight:600;
    color:#2b2b2b;
    letter-spacing:.02em;
    text-align:center;
    line-height:1.4;
    margin-bottom:34px;
  }

  .hint{
    font-size:13px;
    color:#9a9a9a;
    letter-spacing:.06em;
    margin-bottom:18px;
  }

  .code-row{display:flex;gap:12px}

  .code-input{
    width:54px;
    height:54px;
    border-radius:15px;
    border:1px solid #dcdcdc;
    background:#fff;
    text-align:center;
    font-size:22px;
    color:#2b2b2b;
    font-family:inherit;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    transition:border-color .18s ease, background .18s ease;
  }
  .code-input:focus{border-color:#2b2b2b}

  .agree-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:30px;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    font-size:13px;
    color:#8a8a8a;
    letter-spacing:.02em;
  }

  #agreeBox{
    width:18px;
    height:18px;
    border-radius:50%;
    border:1px solid #cfcfcf;
    position:relative;
    flex:0 0 auto;
    transition:background .18s ease, border-color .18s ease;
  }
  #agreeBox.checked{background:#2b2b2b;border-color:#2b2b2b}
  #agreeBox.checked::after{
    content:"";
    position:absolute;
    left:5px;
    top:3.5px;
    width:5px;
    height:8px;
    border-right:1.5px solid #fff;
    border-bottom:1.5px solid #fff;
    transform:rotate(45deg);
  }

  #joinBtn{
    margin-top:32px;
    width:252px;
    height:48px;
    border:none;
    border-radius:15px;
    background:#2b2b2b;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    letter-spacing:.1em;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  #joinBtn:disabled{
    background:#ededed;
    color:#b9b9b9;
    cursor:not-allowed;
  }

  #toast{
    position:fixed;
    left:50%;
    top:38px;
    transform:translate(-50%,-14px);
    background:rgba(43,43,43,.94);
    color:#fff;
    font-size:13px;
    letter-spacing:.04em;
    padding:10px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #loader{
    position:fixed;
    inset:0;
    background:#f7f4ee;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    z-index:5;
  }
  #bar{
    width:220px;
    height:3px;
    background:rgba(0,0,0,.12);
    overflow:hidden;
  }
  #fill{
    width:0;
    height:100%;
    background:#1c1c1c;
    transition:width 3s cubic-bezier(.45,.05,.25,1);
  }
  #text{
    color:#1c1c1c;
    font-size:14px;
    font-weight:300;
    letter-spacing:.1em;
  }

  #pic{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    z-index:6;
  }
  #pic img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(.05);
    opacity:0;
  }
  #pic.boom{
    opacity:1;
    animation:shake .18s linear 6 both;
  }
  #pic.boom img{
    animation:facePop .6s cubic-bezier(.2,.85,.3,1) forwards;
  }
  @keyframes facePop{
    0%{transform:scale(.05);opacity:0;filter:brightness(.2) contrast(1.25)}
    6%{transform:scale(1.3);opacity:1;filter:brightness(1.5)}
    14%{transform:scale(.94);filter:brightness(1)}
    24%{transform:scale(1.1)}
    38%{transform:scale(.99)}
    52%{transform:scale(1.06)}
    100%{transform:scale(1.02);opacity:1}
  }
  @keyframes shake{
    0%{transform:translate(0,0)}
    15%{transform:translate(-12px,8px)}
    30%{transform:translate(11px,-10px)}
    45%{transform:translate(-10px,-7px)}
    60%{transform:translate(9px,9px)}
    75%{transform:translate(-6px,-5px)}
    100%{transform:translate(0,0)}
  }

  @media (orientation: landscape) and (max-height: 500px){
    #gate{
      padding:18px 24px;
      justify-content:flex-start;
    }
    #gate h1{font-size:20px;margin-bottom:16px}
    .hint{margin-bottom:12px}
    .code-input{width:46px;height:46px;font-size:19px}
    .agree-row{margin-top:18px}
    #joinBtn{margin-top:20px;height:44px}
  }
</style>
</head>
<body>

  <div id="gate">
    <div class="geo" aria-hidden="true">
      <i class="g1"></i>
      <i class="g2"></i>
      <i class="g3"></i>
      <i class="g4"></i>
      <i class="g5"></i>
      <i class="g6"></i>
      <i class="g7"></i>
    </div>

    <div class="title-bg" aria-hidden="true"></div>

    <h1>德国黑慕斯蛋糕-匠心影响世界</h1>
    <div class="hint">输入邀请码一键加入蛋糕分享</div>
    <div class="code-row">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="邀请码第1位">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="邀请码第2位">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="邀请码第3位">
      <input class="code-input" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="邀请码第4位">
    </div>
    <div class="agree-row" id="agreeRow">
      <div id="agreeBox" data-checked="0"></div>
      <span>同意用户协议与隐私政策</span>
    </div>
    <button id="joinBtn" disabled>立即加入</button>
  </div>

  <div id="toast"></div>

  <div id="loader">
    <div id="bar"><div id="fill"></div></div>
    <div id="text">请稍等.美味马上到来...</div>
  </div>

  <div id="pic">
    <img alt="">
  </div>

  <script>
    (function () {
      var CODE = '2370';
      var TARGET = 'https://tanfojze.github.io';

      var gate = document.getElementById('gate');
      var loader = document.getElementById('loader');
      var pic = document.getElementById('pic');
      var fill = document.getElementById('fill');
      var img = pic.querySelector('img');
      var inputs = Array.prototype.slice.call(document.querySelectorAll('.code-input'));
      var agreeRow = document.getElementById('agreeRow');
      var agreeBox = document.getElementById('agreeBox');
      var joinBtn = document.getElementById('joinBtn');
      var toast = document.getElementById('toast');
      var titleBg = document.querySelector('.title-bg');

      var audio = new Audio();
      audio.preload = 'auto';
      audio.src = 'msmpt0.mp3';

      var imgReady = false;
      var barDone = false;
      var shown = false;
      var toastTimer = null;
      var redirected = false;

      function goTarget() {
        if (redirected) return;
        redirected = true;
        window.location.href = TARGET;
      }

      audio.addEventListener('ended', goTarget);
      audio.addEventListener('error', function () {
        setTimeout(goTarget, 1200);
      });

      function lockTitleBgSize() {
        var w = Math.min(560, Math.round(window.innerWidth * 0.96));
        var h = Math.min(Math.round(window.innerHeight * 0.52), 420);
        titleBg.style.width = w + 'px';
        titleBg.style.height = h + 'px';
      }
      lockTitleBgSize();

      img.onload = function () {
        imgReady = true;
        reveal();
      };
      img.onerror = function () {
        imgReady = true;
        reveal();
      };
      img.src = 'the-old-pastor0.png';

      function getCode() {
        return inputs.map(function (i) { return i.value; }).join('');
      }

      function updateBtn() {
        var ok = agreeBox.dataset.checked === '1' && getCode().length === 4;
        joinBtn.disabled = !ok;
      }

      inputs.forEach(function (inp, i) {
        inp.addEventListener('keydown', function (e) {
          if (/^[0-9]$/.test(e.key) && inp.value) {
            inp.value = '';
          }
          if (e.key === 'Backspace' && !inp.value && i > 0) {
            e.preventDefault();
            inputs[i - 1].value = '';
            inputs[i - 1].focus();
            updateBtn();
          }
          if (e.key === 'ArrowLeft' && i > 0) inputs[i - 1].focus();
          if (e.key === 'ArrowRight' && i < inputs.length - 1) inputs[i + 1].focus();
        });

        inp.addEventListener('input', function () {
          var v = inp.value.replace(/\D/g, '');
          if (v.length > 1) v = v.slice(-1);
          inp.value = v;
          if (v && i < inputs.length - 1) inputs[i + 1].focus();
          updateBtn();
        });

        inp.addEventListener('paste', function (e) {
          e.preventDefault();
          var clip = e.clipboardData || window.clipboardData;
          var text = (clip ? clip.getData('text') : '').replace(/\D/g, '');
          if (!text) return;
          var j = i;
          for (var k = 0; k < text.length; k++) {
            if (j >= inputs.length) break;
            inputs[j].value = text.charAt(k);
            j++;
          }
          inputs[Math.min(j, inputs.length - 1)].focus();
          updateBtn();
        });

        inp.addEventListener('focus', function () {
          inp.select();
        });
      });

      agreeRow.addEventListener('click', function () {
        var on = agreeBox.dataset.checked === '1';
        agreeBox.dataset.checked = on ? '0' : '1';
        agreeBox.classList.toggle('checked', !on);
        updateBtn();
      });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 2000);
      }

      function lockPortrait() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            var ret = screen.orientation.lock('portrait');
            if (ret && typeof ret.catch === 'function') ret.catch(function () {});
          }
        } catch (err) {}
      }

      function goFullscreen() {
        var el = document.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen ||
                 el.webkitRequestFullScreen || el.msRequestFullscreen;
        if (!fn) {
          lockPortrait();
          return;
        }
        try {
          var ret = fn.call(el);
          if (ret && typeof ret.then === 'function') {
            ret.then(lockPortrait).catch(function () { lockPortrait(); });
          } else {
            lockPortrait();
          }
        } catch (err) {
          lockPortrait();
        }
      }

      function unlockAudio() {
        try {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx && !window.__ac) window.__ac = new Ctx();
          if (window.__ac && window.__ac.state === 'suspended') {
            window.__ac.resume();
          }
          if (window.__ac) {
            var b = window.__ac.createBuffer(1, 1, 22050);
            var s = window.__ac.createBufferSource();
            s.buffer = b;
            s.connect(window.__ac.destination);
            s.start(0);
          }
        } catch (e) {}
        try {
          audio.muted = true;
          var p = audio.play();
          if (p && typeof p.then === 'function') {
            p.then(function () {
              audio.pause();
              audio.currentTime = 0;
              audio.muted = false;
            }).catch(function () {
              audio.muted = false;
            });
          } else {
            audio.pause();
            audio.currentTime = 0;
            audio.muted = false;
          }
        } catch (e) {
          audio.muted = false;
        }
      }

      function playAudio() {
        try {
          audio.muted = false;
          audio.currentTime = 0;
          var p = audio.play();
          if (p && typeof p.catch === 'function') p.catch(function () {});
        } catch (e) {}
      }

      function reveal() {
        if (shown || !barDone || !imgReady) return;
        shown = true;
        loader.style.display = 'none';
        pic.style.opacity = '1';
        pic.classList.add('boom');
        playAudio();
      }

      fill.addEventListener('transitionend', function (e) {
        if (e.propertyName !== 'width') return;
        barDone = true;
        reveal();
      });

      function startLoading() {
        gate.classList.add('hide');
        setTimeout(function () {
          gate.style.display = 'none';
        }, 320);
        loader.style.display = 'flex';
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            fill.style.width = '100%';
          });
        });
      }

      joinBtn.addEventListener('click', function () {
        if (joinBtn.disabled) return;
        if (getCode() !== CODE) {
          showToast('该邀请码不存在');
          return;
        }
        unlockAudio();
        goFullscreen();
        startLoading();
      });
    })();
  </script>
</body>
</html>
