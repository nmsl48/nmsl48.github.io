<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德国黑慕斯蛋糕-匠心影响世界</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #loader{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    transition:opacity .15s linear;
  }
  #bar{
    width:220px;
    height:3px;
    background:rgba(255,255,255,.18);
    overflow:hidden;
  }
  #fill{
    width:0;
    height:100%;
    background:#fff;
    transition:width 3s cubic-bezier(.45,.05,.25,1);
  }
  #text{
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    font-size:14px;
    font-weight:300;
    letter-spacing:.1em;
  }
  #pic{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
  }
  #pic img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scale(.02);
    transition:transform .22s cubic-bezier(.2,.85,.3,1);
  }
</style>
</head>
<body>
  <div id="loader">
    <div id="bar"><div id="fill"></div></div>
    <div id="text">请稍等.美味马上到来...</div>
  </div>
  <div id="pic">
    <img src="the-old-pastor0.png" alt="">
  </div>
  <script>
    (function () {
      var fill = document.getElementById('fill');
      var loader = document.getElementById('loader');
      var pic = document.getElementById('pic');
      var img = pic.querySelector('img');

      requestAnimationFrame(function () {
        fill.style.width = '100%';
      });

      fill.addEventListener('transitionend', function () {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.style.display = 'none';
        }, 150);

        pic.style.opacity = '1';
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            img.style.transform = 'scale(1)';
          });
        });
      }, { once: true });
    })();
  </script>
</body>
</html>
